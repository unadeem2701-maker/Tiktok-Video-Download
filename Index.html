<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Mobile Force Dark Mode Meta -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#030712">
    <title>TikTok Video Downloader Ultimate Pro 🇵🇸</title>
    <style>
        /* Force Dark Background Globally */
        :root {
            color-scheme: dark !important;
            --bg-primary: #030712;
            --bg-secondary: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.85);
            --accent-neon: #38bdf8;
            --accent-pink: #ec4899;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.12);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            background-color: #030712 !important;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%) !important;
            background-attachment: fixed !important;
            color: #f8fafc !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        /* Palestine Badge Header */
        .palestine-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(90deg, #000000 0%, #007a3d 33%, #ffffff 66%, #ce1126 100%);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            color: #0f172a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Glassmorphism Card */
        .glass-card {
            background: var(--bg-card) !important;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            position: relative;
        }

        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple));
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Inputs & Heavy Buttons */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.9) !important;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff !important;
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-field:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .btn-heavy {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-neon), var(--accent-purple), var(--accent-pink));
            background-size: 200% 200%;
            color: #ffffff !important;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-heavy:hover {
            background-position: 100% 100%;
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(236, 72, 153, 0.7);
        }

        /* Status & Output Cards */
        .output-box {
            margin-top: 20px;
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 20px;
            display: none;
        }

        .video-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .video-thumb {
            width: 70px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-glass);
        }

        .video-details h4 {
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .video-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .download-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: var(--transition-smooth);
        }

        .download-action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        /* History Architecture */
        .history-container {
            margin-top: 15px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-row {
            background: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-link-text {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-timestamp {
            font-size: 11px;
            color: var(--accent-neon);
            font-weight: 600;
        }

        .clear-btn {
            background: rgba(244, 63, 94, 0.2);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: var(--accent-red) !important;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .app-footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: auto;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="palestine-badge">
            <span>🇵🇸</span> Free Palestine • Enterprise Downloader Engine
        </div>

        <div class="glass-card">
            <div class="app-header">
                <h1 class="app-title">TikTok Vault Pro</h1>
                <p class="app-subtitle">Zero Watermark • Ultra HD Extraction Core</p>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('single')">Single Downloader</button>
                <button class="tab-btn" onclick="switchTab('batch')">Batch Queue</button>
                <button class="tab-btn" onclick="switchTab('history')">Vault Logs</button>
            </div>

            <!-- TAB 1: SINGLE DOWNLOADER -->
            <div id="tab-single" class="tab-content active">
                <div class="input-group">
                    <input type="text" id="targetUrl" class="input-field" placeholder="Paste TikTok Video Link here (https://...)">
                    <button class="btn-heavy" onclick="processDownload()">
                        <span>⚡ Extract & Download Video</span>
                    </button>
                </div>

                <div id="statusOutput" class="output-box">
                    <div id="outputContent"></div>
                </div>
            </div>

            <!-- TAB 2: BATCH QUEUE -->
            <div id="tab-batch" class="tab-content">
                <div class="input-group">
                    <textarea id="batchUrls" class="input-field" rows="4" placeholder="Paste multiple links (one link per line)..." style="resize: none;"></textarea>
                    <button class="btn-heavy" onclick="processBatchQueue()">
                        <span>🚀 Run Batch Extraction</span>
                    </button>
                </div>
                <div id="batchOutput" class="output-box">
                    <div style="font-size: 13px; color: var(--text-muted);">Batch processing queue initialized. Enter links above.</div>
                </div>
            </div>

            <!-- TAB 3: HISTORY VAULT -->
            <div id="tab-history" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="font-size: 15px; font-weight: 700;">Recent Downloads Vault</h3>
                    <button class="clear-btn" onclick="clearVaultLogs()">Purge Vault</button>
                </div>
                <div id="historyContainer" class="history-container">
                    <p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">Vault is currently empty.</p>
                </div>
            </div>
        </div>

        <div class="app-footer">
            TikTok Vault Pro Engine v5.0 • Force Dark Mode Active
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'single') {
                document.getElementById('tab-single').classList.add('active');
                event.target.classList.add('active');
            } else if (tabName === 'batch') {
                document.getElementById('tab-batch').classList.add('active');
                event.target.classList.add('active');
            } else if (tabName === 'history') {
                document.getElementById('tab-history').classList.add('active');
                event.target.classList.add('active');
                renderVaultLogs();
            }
        }

        async function processDownload() {
            const urlInput = document.getElementById('targetUrl').value.trim();
            const statusBox = document.getElementById('statusOutput');
            const outputContent = document.getElementById('outputContent');

            statusBox.style.display = 'block';

            if (!urlInput || (!urlInput.includes('tiktok.com') && !urlInput.includes('douyin.com'))) {
                outputContent.innerHTML = `<span style="color: var(--accent-red); font-size: 13px; font-weight: 700;">❌ Error: Please enter a valid TikTok resource link!</span>`;
                return;
            }

            outputContent.innerHTML = `<div style="text-align: center; color: var(--accent-neon); font-size: 13px;">⏳ Connecting to secure media servers...</div>`;

            try {
                const apiFetch = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const responseData = await apiFetch.json();

                if (responseData.code === 0 && responseData.data.play) {
                    const videoStreamUrl = responseData.data.play;
                    const creatorName = responseData.data.author.nickname || "Unknown Creator";
                    const videoCover = responseData.data.cover || "";
                    const videoTitle = responseData.data.title || "TikTok Video File";

                    outputContent.innerHTML = `
                        <div class="video-meta">
                            ${videoCover ? `<img src="${videoCover}" class="video-thumb" alt="Thumb">` : ''}
                            <div class="video-details">
                                <h4>${videoTitle.substring(0, 45)}...</h4>
                                <p>Creator: <strong>${creatorName}</strong></p>
                                <p style="color: var(--accent-green); margin-top: 4px;">● Watermark Removed</p>
                            </div>
                        </div>
                        <a href="${videoStreamUrl}" target="_blank" download="TikTok_HD_${Date.now()}.mp4" class="download-action-btn">
                            ⬇️ Download HD Video (.mp4)
                        </a>
                    `;

                    saveToVault(urlInput);
                    document.getElementById('targetUrl').value = '';
                } else {
                    outputContent.innerHTML = `<span style="color: var(--accent-red); font-size: 13px; font-weight: 700;">❌ Extraction Failed: Target resource is private or deleted.</span>`;
                }
            } catch (networkError) {
                outputContent.innerHTML = `<span style="color: var(--accent-red); font-size: 13px; font-weight: 700;">❌ Network Exception: Check your connection and retry.</span>`;
            }
        }

        function processBatchQueue() {
            const batchText = document.getElementById('batchUrls').value.trim();
            const batchOutput = document.getElementById('batchOutput');
            
            if(!batchText) {
                batchOutput.innerHTML = `<span style="color: var(--accent-red); font-size: 13px;">Please paste at least one link in the batch box.</span>`;
                return;
            }

            const links = batchText.split('\n').filter(l => l.trim().length > 0);
            batchOutput.style.display = 'block';
            batchOutput.innerHTML = `<div style="color: var(--accent-neon); font-size: 13px;">⚡ Successfully queued ${links.length} items for processing.</div>`;
        }

        function saveToVault(url) {
            let vault = JSON.parse(localStorage.getItem('tiktok_enterprise_vault') || '[]');
            vault.unshift({
                url: url,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
            });
            if (vault.length > 20) vault.pop();
            localStorage.setItem('tiktok_enterprise_vault', JSON.stringify(vault));
        }

        function renderVaultLogs() {
            let vault = JSON.parse(localStorage.getItem('tiktok_enterprise_vault') || '[]');
            const container = document.getElementById('historyContainer');

            if (vault.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">Vault is currently empty.</p>`;
                return;
            }

            container.innerHTML = '';
            vault.forEach(item => {
                container.innerHTML += `
                    <div class="history-row">
                        <span class="history-link-text">${item.url}</span>
                        <span class="history-timestamp">${item.timestamp}</span>
                    </div>
                `;
            });
        }

        function clearVaultLogs() {
            localStorage.removeItem('tiktok_enterprise_vault');
            renderVaultLogs();
        }
    </script>
</body>
</html>
